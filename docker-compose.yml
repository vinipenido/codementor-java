services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codementor-postgres
    environment:
      POSTGRES_USER: codementor
      POSTGRES_PASSWORD: vini14192306@
      POSTGRES_DB: codementor
    ports:
      - "5432:5432"
    volumes:
      - codementor_pgdata:/var/lib/postgresql/data

volumes:
  codementor_pgdata: